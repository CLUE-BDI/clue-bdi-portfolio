databases:
  - name: clue-bdi-portfolio-db
    databaseName: portfolio
    user: portfolio_user
    plan: free

services:
  - type: web
    name: clue-bdi-portfolio-app
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clue-bdi-portfolio-db
          property: connectionString
